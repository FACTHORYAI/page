name: Facthory CodeQL SARIF

# Code scanning runs as GitHub's default setup, and its findings can't be read through the API
# this repository's automation has. This runs the same CodeQL analysis for the same languages
# (rust, python, actions), writes SARIF without uploading it to code scanning (upload: never), and
# keeps the files as the workflow artifact `codeql-sarif` for 14 days, so a person or a Claude
# session can read and fix the findings. By hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facthory-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # CodeQL needs it to run; nothing is uploaded to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust,python,actions
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: never
          output: sarif-results
          category: /facthory-codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results/*.sarif
          if-no-files-found: error
          retention-days: 14
