name: Facthory Page release

# Signed installers of the branded app (W4). Each job brands a fresh checkout
# (facthory/rebrand.py) and runs the app's own packaging scripts, which sign when their secrets
# are set:
#
#   macOS    facthorypage-<v>-macos-universal.dmg (Developer ID, notarized), CLI zip
#   Windows  facthorypage-<v>-windows-<arch>.msi (signed), portable zip; x64 and arm64
#   Linux    AppImage (+ .zsync for delta updates), .deb, .rpm, .tar.gz; x86_64 and aarch64
#
# A tag v<version> (the version in Cargo.toml) builds a release: signing is required, and the
# result is a draft GitHub release with SHA256SUMS and the update feed latest.json, published by
# a person after checking it. A manual run builds the same, unsigned when secrets are missing,
# and keeps the files as workflow artifacts. Secrets live in the environment `release`
# (bandpey-hq/github-infra), which only tags v* and main may use. A pull request that changes the
# release or the packaging builds everything unsigned, outside that environment, as a check.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/facthory-release.yml
      - facthory/**
      - packaging/**
  workflow_dispatch:

concurrency:
  group: facthory-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      craft-fonts: ${{ steps.v.outputs.craft-fonts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version=$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in Cargo.toml (${version}); tag v${version}."
            exit 1
          fi
          # The craft-fonts commit this tree's own CI and release name; none: the suite's pin.
          fonts=$(cat .github/workflows/ci.yml .github/workflows/release.yml 2>/dev/null \
            | grep -o -E '(CRAFT_FONTS_REF|craft-fonts-ref): *"?[0-9a-f]{40}' | head -1 | grep -o -E '[0-9a-f]{40}' || true)
          {
            echo "version=${version}"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "craft-fonts=${fonts:-bfcbf714e45a3ea8e98f88ab2b7971372a576414}"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    # Pull requests get no signing secrets: no environment.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    timeout-minutes: 120
    env:
      FACTHORY_PAGE_VERSION: ${{ needs.version.outputs.version }}
      FACTHORY_PAGE_BUILD_DATE: ${{ needs.version.outputs.date }}
      FACTHORY_PAGE_BUILD_SHA: ${{ github.sha }}
      # The updater's feed (facthory/update/): builds without it never check.
      FACTHORY_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - name: Require signing for a tagged release
        if: github.ref_type == 'tag'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::A release must be signed and notarized; the environment release lacks:$missing"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: facthory-release-macos
      - name: Apply the Facthory brand
        run: python3 facthory/rebrand.py apply
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ needs.version.outputs.craft-fonts }}
          path: craft-fonts
          persist-credentials: false
      - name: The DMG window, branded
        # The window's background and layout name the app and volume; generate.py renders them
        # from the branded background.svg and the app's name.
        run: |
          brew install resvg
          python3 -m pip install --quiet "ds_store==1.3.3" "mac_alias==2.2.3" "pillow==12.3.0"
          python3 packaging/macos/dmg/generate.py
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch universal
      - name: No upstream mark in what ships
        run: python3 facthory/rebrand.py check target/*-apple-darwin/release/facthorypage target/*-apple-darwin/release/facthorypage-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove the temporary keychain
        if: always()
        run: if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    # Pull requests get no signing secrets: no environment.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      FACTHORY_PAGE_VERSION: ${{ needs.version.outputs.version }}
      FACTHORY_PAGE_BUILD_DATE: ${{ needs.version.outputs.date }}
      FACTHORY_PAGE_BUILD_SHA: ${{ github.sha }}
      # The updater's feed (facthory/update/): builds without it never check.
      FACTHORY_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - name: Require signing for a tagged release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then exit 0; fi
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::A release must be signed: no WINDOWS_CERTIFICATE pair, and the environment release lacks:$missing"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: facthory-release-windows-${{ matrix.arch }}
      - name: Apply the Facthory brand
        shell: bash
        run: python facthory/rebrand.py apply
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ needs.version.outputs.craft-fonts }}
          path: craft-fonts
          persist-credentials: false
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@13491f8120782bf106fb7859332929bf6c1cdb5d
        with:
          wix-version: "5.0.2"
      - name: Build, sign, package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - name: No upstream mark in what ships
        shell: bash
        run: python facthory/rebrand.py check target/${{ matrix.target }}/release/facthorypage.exe target/${{ matrix.target }}/release/facthorypage-cli.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the AppImage runs on any distribution with this glibc or newer.
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      FACTHORY_PAGE_VERSION: ${{ needs.version.outputs.version }}
      FACTHORY_PAGE_BUILD_DATE: ${{ needs.version.outputs.date }}
      FACTHORY_PAGE_BUILD_SHA: ${{ github.sha }}
      # The updater's feed (facthory/update/): builds without it never check.
      FACTHORY_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: storytold/craft-common-actions/actions/install-linux-deps@13491f8120782bf106fb7859332929bf6c1cdb5d
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: "2.47.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: facthory-release-linux-${{ matrix.arch }}
      - name: Apply the Facthory brand
        run: python3 facthory/rebrand.py apply
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ needs.version.outputs.craft-fonts }}
          path: craft-fonts
          persist-credentials: false
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: No upstream mark in what ships
        # The binaries, and every text file inside the .deb (desktop entry, AppStream metadata,
        # docs). Left out: licences and notices, which keep upstream's copyright, and README.md,
        # our front page, which credits upstream by name.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x dist/release/*.deb "$RUNNER_TEMP/deb"
          mapfile -t files < <(find "$RUNNER_TEMP/deb" -type f ! -name '*.png' ! -name '*.svg' ! -name 'LICENSE*' ! -name 'NOTICE*' ! -name 'OFL-*' ! -name 'README*')
          python3 facthory/rebrand.py check "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    # A tag's build becomes a draft release; a person checks the installers and publishes it.
    # Other runs write the same files and keep them as an artifact.
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums and the update feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 facthory/release.py dist "$VERSION" "$REPO"
      - name: Keep the release files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/release-files/*
            dist/NOTES.md
          if-no-files-found: error
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" --draft --verify-tag --title "Facthory Page ${VERSION}" \
            --notes-file dist/NOTES.md dist/release-files/*
