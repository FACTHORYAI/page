name: Facthory Page

# The product build: upstream's tree with the Facthory brand applied (facthory/rebrand.py), then
# upstream's own quality gate on the branded tree, a release build, and the check that no
# upstream mark is left in what ships. Upstream's ci.yml keeps gating the unbranded tree.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facthory-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins:
    # The craft-fonts commit this tree's own CI and release name (ci.yml, then release.yml), so
    # the branded tests see the fonts upstream tested this tree with; a tree that names none
    # takes the default of the gate pinned below.
    runs-on: ubuntu-24.04
    outputs:
      craft-fonts: ${{ steps.pin.outputs.craft-fonts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - id: pin
        run: |
          ref=$(cat .github/workflows/ci.yml .github/workflows/release.yml 2>/dev/null \
            | grep -o -E '(CRAFT_FONTS_REF|craft-fonts-ref): *"?[0-9a-f]{40}' | head -1 | grep -o -E '[0-9a-f]{40}' || true)
          echo "craft-fonts=${ref:-bfcbf714e45a3ea8e98f88ab2b7971372a576414}" >> "$GITHUB_OUTPUT"

  build:
    needs: pins
    # Pinned to a commit, not @main: this workflow builds what we ship. Bumped with upstream syncs
    # (with the gate's craft-fonts default above).
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@2b3fb9dc05036f73c77d18f753a3aa9da55fa386
    with:
      craft-fonts-ref: ${{ needs.pins.outputs.craft-fonts }}
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      timeout-minutes: 120
      command: |
        python3 facthory/rebrand.py apply
        cargo fmt --all
        cargo xtask ci
        cargo build --release --locked -p facthorypage -p facthorypage-cli
        python3 facthory/rebrand.py check target/release/facthorypage target/release/facthorypage-cli

  branded-check:
    # The required check, under a name we own: the call above reports as "build / gate (<runner>)",
    # which follows the shared gate workflow's job name and runner. Fails unless it succeeded.
    name: branded
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: The branded build passed
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The branded build ended with ${RESULT}."
            exit 1
          fi
