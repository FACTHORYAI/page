name: Facthory Page fidelity

# The fidelity corpus (W6, facthory/corpus/): real .docx files Word wrote, each pinned by URL and
# SHA-256 in corpus.toml and never committed, opened, round-tripped and rendered by the branded
# command-line tool. The pass rates are the job summary; report.json and report.md are an
# artifact (our renders are not: some files need a content check before theirs are published).
#
# Weekly over every file, by hand over the tier you pick, and on pull requests that change the
# corpus or this workflow over the smoke tier. It measures; it fails only when the run itself
# breaks.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      tier:
        description: "smoke: 20 small files; full: every file"
        type: choice
        options: [smoke, full]
        default: smoke
  pull_request:
    paths:
      - .github/workflows/facthory-fidelity.yml
      - facthory/corpus/**

permissions:
  contents: read

concurrency:
  group: facthory-fidelity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The craft-fonts commit upstream's CI builds with, as a literal as there: a checkout whose ref
  # is computed at run time is untrusted to code scanning. The step below warns when they part.
  CRAFT_FONTS_REF: 8dcdacd5153e64560d109541a47d806f26f048c0

jobs:
  fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: storytold/craft-common-actions/actions/install-linux-deps@13491f8120782bf106fb7859332929bf6c1cdb5d
      - name: pdfinfo, for page counts
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: facthory-fidelity
      - name: The craft-fonts commit upstream builds with
        run: |
          upstream=$(cat .github/workflows/ci.yml .github/workflows/release.yml 2>/dev/null \
            | grep -o -E '(CRAFT_FONTS_REF|craft-fonts-ref): *"?[0-9a-f]{40}' | head -1 | grep -o -E '[0-9a-f]{40}' || true)
          if [ -n "$upstream" ] && [ "$upstream" != "$CRAFT_FONTS_REF" ]; then
            echo "::warning::Upstream now builds with craft-fonts $upstream; set CRAFT_FONTS_REF in this workflow to it."
          fi
      - name: Apply the Facthory brand
        run: python3 facthory/rebrand.py apply
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - name: Build the command-line tool
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo build --release --locked -p facthorypage-cli
      - name: The corpus, from earlier runs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/facthory-corpus
          key: facthory-corpus-${{ hashFiles('facthory/corpus/corpus.toml') }}
          restore-keys: facthory-corpus-
      - name: Run the corpus
        env:
          TIER: ${{ inputs.tier || (github.event_name == 'schedule' && 'full') || 'smoke' }}
        run: |
          python3 facthory/corpus/fidelity.py --cli target/release/facthorypage-cli --tier "$TIER" --out fidelity
          cat fidelity/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fidelity-report
          path: |
            fidelity/report.json
            fidelity/report.md
          if-no-files-found: warn
