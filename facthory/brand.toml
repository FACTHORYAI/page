# Facthory Page: upstream WordCraft (storytold/wordcraft) under the Facthory brand.
# Applied to a fresh checkout by facthory/rebrand.py before every build; the tracked tree stays
# upstream's so releases merge cleanly. Order and semantics: the docstring of rebrand.py.

[brand]
name = "Facthory Page"
app_id = "com.facthory.page"
publisher = "Bandpey GmbH"
website = "https://facthory.com/page"
repository = "https://github.com/FACTHORYAI/page"
support = "https://github.com/FACTHORYAI/page/issues"

[upstream]
name = "WordCraft"
team = "ArtCraft team"
repository = "https://github.com/storytold/wordcraft"

[icon]
svg = "page.svg"
base = "facthorypage"

# Facthory's other asset files, credited in ATTRIBUTION.md's Facthory block (render.py).
[[asset]]
path = "dmg/background.svg"
author = "@XusBadia (WordCraft contributors); recoloured and retitled by Bandpey GmbH"
source = "derived from WordCraft's `packaging/macos/dmg/background.svg`; title outlined from Inter SemiBold (OFL-1.1)"
licence = "MIT OR Apache-2.0"

[files]
# Never touched: upstream's licences and notices stay exactly as written (Apache-2.0 §4).
skip = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE", ".github"]
# Credit files: only tokens marked credits = true (ids, paths, URLs) apply, so upstream's authors
# keep their credit while the paths they name follow the renames.
credits = ["ATTRIBUTION.md", "contributors"]
# The ArtCraft marks, licensed only for unmodified WordCraft (docs/brand/LICENSE-brand.txt).
delete = ["docs/brand"]
# Authorship lines the tokens would otherwise turn into a false credit: upstream's data files
# (the spelling supplements, embedded in the app) say who wrote them.
keep = ["Written by WordCraft contributors"]

# ---------------------------------------------------------------------------------------------
# Rules before the tokens, on upstream's text. Each fails the build when upstream moves it.

[[rule]]
why = "ProgIDs, the AppDir and other dotted names cannot take the space in the display name"
files = ["packaging/*", "apps/*"]
find = 'WordCraft\.(?=[A-Z])'
replace = 'FacthoryPage.'
regex = true

[[rule]]
why = "Settings › Default apps takes the registered name URL-encoded"
files = "apps/wordcraft/src/default_apps.rs"
find = "registeredAppMachine=WordCraft"
replace = "registeredAppMachine=Facthory%20Page"
count = 2

[[rule]]
why = "The ArtCraft Discord becomes our issue tracker: About link"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = 'tl!("Join us on Discord: discord.gg/artcraft")'
replace = 'tl!("Report a problem: github.com/FACTHORYAI/page/issues")'
count = 1

[[rule]]
why = "The title-bar community pill: help, hidden by default"
files = "crates/ui-egui/src/chrome.rs"
find = 'tl!("Join the ArtCraft community on Discord")'
replace = 'tl!("Get help or report a problem")'
count = 1

[[rule]]
files = "crates/ui-egui/src/chrome.rs"
find = 'tl!("Discord"), medium(11.5)'
replace = 'tl!("Help"), medium(11.5)'
count = 1

[[rule]]
files = "crates/ui-egui/src/chrome.rs"
find = '"discord",(\s+t\.on_accent,)'
replace = '"help",\1'
regex = true
count = 1

[[rule]]
files = "crates/ui-egui/src/lib.rs"
find = "show_discord: true,"
replace = "show_discord: false,"
count = 1

[[rule]]
why = "Help tab: the Community Discord button"
files = "crates/ui-egui/src/ribbon/review.rs"
find = '"discord", "Community\nDiscord", "ui.discord"'
replace = '"help", "Help and\nFeedback", "ui.discord"'
count = 1

[[rule]]
why = "File backstage: the Discord community entry"
files = "crates/ui-egui/src/backstage.rs"
find = '("Discord community", "discord")'
replace = '("Help and feedback", "discord")'
count = 1

[[rule]]
files = "crates/ui-egui/src/keytips.rs"
find = 'c("Community Discord", "ui.discord")'
replace = 'c("Help and feedback", "ui.discord")'
count = 1

# The spelling list (sorted; a test checks the order) knows our name in its place, not upstream's.
[[rule]]
why = "The spelling list drops ArtCraft"
files = "assets/spelling/en-extra.txt"
find = '^artcraft\n'
replace = ""
regex = true
count = 1

[[rule]]
why = "The spelling list drops WordCraft"
files = "assets/spelling/en-extra.txt"
find = '^wordcraft\n'
replace = ""
regex = true
count = 1

[[rule]]
why = "The spelling list knows Facthory, in its sorted place"
files = "assets/spelling/en-extra.txt"
find = '^facebook\n'
replace = "facebook\nfacthory\n"
regex = true
count = 1

[[rule]]
why = "macOS: the CLI goes inside the app, beside the app's own executable, so a Facthory agent finds the MCP server where the app is installed (W5); the Windows and Linux installers already carry it"
files = "packaging/macos/package.sh"
find = '''
cp "$WORK/bin/wordcraft" "$APP/Contents/MacOS/WordCraft"
'''
replace = '''
cp "$WORK/bin/wordcraft" "$APP/Contents/MacOS/WordCraft"
cp "$WORK/bin/wordcraft-cli" "$APP/Contents/MacOS/wordcraft-cli"
'''
count = 1

[[rule]]
why = "... signed with the hardened runtime before the bundle, as nested code is"
files = "packaging/macos/package.sh"
find = '''
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/WordCraft"
'''
replace = '''
sign --options runtime "$APP/Contents/MacOS/wordcraft-cli"
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/WordCraft"
'''
count = 1

[[rule]]
why = "Windows: the installer's suite folder (Programs\\ArtCraft\\<app>, Program Files\\ArtCraft\\<app>) is ours, and the installer's own policy check expects the same name"
files = ["packaging/windows/*.wxs", "packaging/windows/*.wxi", "packaging/windows/*.ps1", "packaging/windows/*.md"]
find = "ArtCraft"
replace = "Facthory"

# Windows signing runs in CI only, through GitHub's OIDC token (the owner's rule, 2026-10-31): the
# release workflow signs in to Azure with azure/login, so no client secret exists anywhere, and
# Artifact Signing's library takes that sign-in from the Azure CLI. facthory-release.yml says so
# with AZURE_SIGNING_OIDC=1; without it, upstream's paths are unchanged.

[[rule]]
why = "Windows signing through OIDC: Artifact Signing needs only its endpoint, account and profile"
files = "packaging/windows/sign.ps1"
find = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
"""
replace = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
if ($env:AZURE_SIGNING_OIDC -eq '1') { $azureVars = 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE' }
"""
count = 1

[[rule]]
why = "... and the signing library tries the Azure CLI's sign-in alone, not the runner's other identities"
files = "packaging/windows/sign.ps1"
find = """
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
replace = """
    } | ForEach-Object {
      if ($env:AZURE_SIGNING_OIDC -eq '1') {
        $_.ExcludeCredentials = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
      }
      $_
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
count = 1

# Upstream's own updater (craft-update, from craft-libs) checks and installs the upstream apps'
# releases, by their repositories and ai.storyteller.* ids, and carries their names into the binary.
# It is left out: facthory/update/ is the updater that runs, and facthory/update/updates_ui.rs
# stands in for upstream's update window ([[copy]] below).

[[rule]]
why = "No self-update helper of upstream's flow at start"
files = "apps/wordcraft/src/main.rs"
find = "    // Windows: the update helper is a copy of this program started with `--finish-update`.\n    #[cfg(windows)]\n    if let Some(result) = craft_update::self_update::finish(&craft_update::suite::WORDCRAFT, &std::env::args_os().skip(1).collect::<Vec<_>>()) {\n        std::process::exit(i32::from(result.is_err()));\n    }\n"
replace = ""
count = 1

[[rule]]
why = "... and no craft-update dependency"
files = ["apps/wordcraft/Cargo.toml", "crates/ui-egui/Cargo.toml"]
find = "craft-update = { workspace = true }\n"
replace = ""
count = 2

[[rule]]
why = "... in the workspace either"
files = "Cargo.toml"
find = '^craft-update = \{ git = "https://github.com/storytold/craft-libs".*\n'
replace = ""
regex = true
count = 1

# The interface catalogs (craft-i18n, [i18n] below): the same changes as the code's rules above,
# so each new English string keeps a row, and the shared catalog's ArtCraft rows, which Facthory
# Page never shows, name us.

[[rule]]
why = "Catalogs: the About link"
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = "Join us on Discord: discord.gg/artcraft"
new_key = "Report a problem: github.com/FACTHORYAI/page/issues"

[[rule]]
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = "Join the ArtCraft community on Discord"
new_key = "Get help or report a problem"

[[rule]]
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = 'Community\nDiscord'
new_key = 'Help and\nFeedback'

[[rule]]
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = "Discord community"
new_key = "Help and feedback"

[[rule]]
why = "The shared catalog's rows that name upstream"
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "ArtCraft website"
new_key = "Facthory website"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "ArtCraft Website"
new_key = "Facthory Website"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "ArtCraft"
new_key = "Facthory"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "Join the ArtCraft Discord"
new_key = "Get help or report a problem"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "Join the ArtCraft Discord…"
new_key = "Get Help or Report a Problem…"

[[rule]]
why = "... and a translation of this row that names upstream (English until translated)"
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "Join us on Discord"
new_key = "Join us on Discord"

# ---------------------------------------------------------------------------------------------
# Tokens, in order, over every text file. credits = true: also in the credit files.

[[token]]
from = "ai.storyteller.wordcraft"
to = "com.facthory.page"
credits = true

[[token]]
from = "ai.storyteller"
to = "com.facthory"
credits = true

[[token]]
from = "wordcraft@storyteller.ai"
to = "support@facthory.com"

[[token]]
from = "https://getartcraft.com/apps/wordcraft"
to = "https://facthory.com/page"
credits = true

[[token]]
from = "getartcraft.com/apps/wordcraft"
to = "facthory.com/page"
credits = true

[[token]]
from = "https://getartcraft.com/"
to = "https://facthory.com/"

[[token]]
from = "https://discord.gg/artcraft"
to = "https://github.com/FACTHORYAI/page/issues"

[[token]]
from = "discord.gg/artcraft"
to = "github.com/FACTHORYAI/page/issues"

[[token]]
from = "github.com/storytold/wordcraft"
to = "github.com/FACTHORYAI/page"

[[token]]
from = "storytold/wordcraft"
to = "FACTHORYAI/page"

[[token]]
from = "Learning Machines LLC"
to = "Bandpey GmbH"

[[token]]
from = "WORDCRAFT"
to = "FACTHORY_PAGE"

[[token]]
from = "WordCraft"
to = "Facthory Page"

[[token]]
from = "Wordcraft"
to = "FacthoryPage"

# Crate, binary, file and directory names: one lowercase word, so Rust identifiers
# (wordcraft_docx -> facthorypage_docx), module paths and log targets stay consistent.
[[token]]
from = "wordcraft"
to = "facthorypage"
credits = true

# ---------------------------------------------------------------------------------------------
# Windows Installer: our own UpgradeCode and component GUIDs, stable across releases.

[guids]
namespace = "https://facthory.com/page/windows-installer"
# The installer's own policy check records the upgrade identity: the same GUIDs, mapped alike.
files = ["packaging/windows/*.wxs", "packaging/windows/install-policy.json"]

# ---------------------------------------------------------------------------------------------
# Rules after the tokens and renames: the credits, which name upstream on purpose.

[[rule]]
phase = "after"
why = "About: who makes it and what it is based on (brand licence: plain-text credit allowed)"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = 'A free, open-source word processor written from scratch in Rust.\nPart of the Crafting Apps from the ArtCraft team.'
replace = 'A free, open-source word processor from Facthory.\nBased on WordCraft by the ArtCraft team.'
count = 1

[[rule]]
phase = "after"
why = "About: our copyright, then upstream's, which the licence requires us to keep"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = "MIT OR Apache-2.0. Copyright (c) 2026 ArtCraft Team and the Facthory Page contributors."
replace = "MIT OR Apache-2.0. Copyright (c) 2026 Bandpey GmbH. Based on WordCraft, copyright (c) 2026 ArtCraft Team and the WordCraft contributors."
count = 1

[[rule]]
phase = "after"
why = "Windows file properties: our copyright and upstream's"
files = "apps/facthorypage/build.rs"
find = '"Copyright (c) the Facthory Page authors. MIT OR Apache-2.0."'
replace = '"Copyright (c) Bandpey GmbH; based on WordCraft, copyright (c) the WordCraft authors. MIT OR Apache-2.0."'
count = 1

[[rule]]
phase = "after"
why = "The app icon is ours; its attribution rows say so"
files = "ATTRIBUTION.md"
find = '^(\| `assets/app-icon/[^`]+` \|).*$'
replace = '\1 Bandpey GmbH | original artwork (`facthory/icons/page.svg`), rendered by `facthory/icons/render.py` | MIT OR Apache-2.0 | Facthory Page app icon |'
regex = true

# The updater (facthory/update/facthory_update.rs, copied below): its module and its calls from
# main.rs. It needs no dependency the app lacks.
[[rule]]
phase = "after"
why = "The updater's module"
files = "apps/facthorypage/src/main.rs"
find = "mod default_apps;\n"
replace = "mod default_apps;\nmod facthory_update;\n"
count = 1

[[rule]]
phase = "after"
why = "The updater starts with the window, in runs that keep preferences"
files = "apps/facthorypage/src/main.rs"
find = "            app.watch_desktop_theme(&cc.egui_ctx);\n"
replace = "            app.watch_desktop_theme(&cc.egui_ctx);\n            facthory_update::start(\"Facthory Page\", facthorypage_control_key::settings_dir().filter(|_| prefs_enabled()));\n"
count = 1

[[rule]]
phase = "after"
why = "The updater's notice"
files = "apps/facthorypage/src/main.rs"
find = "        self.0.ui(ui);\n"
replace = "        self.0.ui(ui);\n        facthory_update::ui(ui.ctx());\n"
count = 1

[[rule]]
phase = "after"
why = "A downloaded update installs as the app quits"
files = "apps/facthorypage/src/main.rs"
find = "        save_prefs(&self.0);\n"
replace = "        save_prefs(&self.0);\n        facthory_update::on_exit();\n"
count = 1

[[rule]]
phase = "after"
why = "... and as macOS quits it, which skips on_exit"
files = "apps/facthorypage/src/main.rs"
find = "    save_prefs(app);\n"
replace = "    save_prefs(app);\n    facthory_update::on_exit();\n"
count = 1

# ---------------------------------------------------------------------------------------------

[[rule]]
phase = "after"
why = "Catalogs: the About credit, as in the code"
files = "craft-i18n/locales/*/facthorypage.tsv"
kind = "tsv"
i18n = true
key = 'A free, open-source word processor written from scratch in Rust.\nPart of the Crafting Apps from the ArtCraft team.'
new_key = 'A free, open-source word processor from Facthory.\nBased on WordCraft by the ArtCraft team.'

[[rule]]
phase = "after"
files = "craft-i18n/locales/*/facthorypage.tsv"
kind = "tsv"
i18n = true
key = "MIT OR Apache-2.0. Copyright (c) 2026 ArtCraft Team and the Facthory Page contributors."
new_key = "MIT OR Apache-2.0. Copyright (c) 2026 Bandpey GmbH. Based on WordCraft, copyright (c) 2026 ArtCraft Team and the WordCraft contributors."

[[copy]]
# Upstream's update window, without its updater (facthory/update/updates_ui.rs).
from = "update/updates_ui.rs"
to = "crates/ui-egui/src/updates_ui.rs"

[[copy]]
from = "update/facthory_update.rs"
to = "apps/facthorypage/src/facthory_update.rs"

[[copy]]
from = "icons/app-icon"
to = "assets/app-icon"
replace = true

[[copy]]
# The DMG window: our colours, title and icon (the release workflow renders it with generate.py).
from = "dmg/background.svg"
to = "packaging/macos/dmg/background.svg"

[[copy]]
# Packages carry README.md (packaging/env.sh copy_docs): ours, not upstream's.
from = "../.github/README.md"
to = "README.md"

[i18n]
# The interface catalogs: storytold/craft-i18n at craft-i18n.rev, which the build checks out here
# (CRAFT_I18N_DIR); the tables Facthory Page embeds are branded with the tree.
dir = "craft-i18n"
tables = ["common.tsv", "wordcraft.tsv"]

# ---------------------------------------------------------------------------------------------
# `rebrand.py check`: no upstream mark in what ships, except the credits above.

[check]
paths = ["packaging", "assets", "apps/*/build.rs", "apps/*/index.html", "Cargo.toml"]
# Developer notes and scripts under packaging/ do not ship.
exclude = ["*/tests/*", "*.png", "*.ico", "*.icns", "*.md", "*.py"]
# These also keep upstream's updater out: its feeds are its repositories (storytold/<app>) and
# its ids ai.storyteller.<app>, and it names the ArtCraft Launcher, so a build that links it
# again fails here (it did: craft-update, upstream releases of 2026-10).
forbid = [
  "artcraft", "wordcraft", "storytold", "storyteller", "getartcraft", "learning machines",
  "crafting apps", "photocraft", "vectorcraft", "filmcraft", "lightcraft", "pdfcraft",
  "effectcraft", "designcraft", "gridcraft", "deckcraft",
]
allow = [
  'Based on WordCraft by the ArtCraft team.',
  'Based on WordCraft, copyright (c) 2026 ArtCraft Team and the WordCraft contributors.',
  'based on WordCraft, copyright (c) the WordCraft authors.',
  'Written by WordCraft contributors',
  # Provenance of the public-domain hyphenation patterns embedded in the app.
  '% DesignCraft US English hyphenation patterns (Liang/TeX notation).',
  "trained with DesignCraft's patgen-style trainer",
  'Released into the public domain (CC0-1.0) by the DesignCraft contributors.',
  # Build input used unmodified (Cargo git dependency), not a product surface.
  'https://github.com/storytold/craft-libs',
  # Upstream's forks of egui and winit (Cargo git dependencies), and the translations the
  # Flatpak recipe checks out: build inputs used unmodified.
  'https://github.com/storytold/egui.git',
  'https://github.com/storytold/winit.git',
  'https://github.com/storytold/craft-i18n',
  # The installer's policy check, shared by upstream's apps, names its siblings' ids (build time).
  "$policy.id -in 'deckcraft','filmcraft','soundcraft'",
]

# ---------------------------------------------------------------------------------------------
# facthory/sync.py: upstream files the patch set removed stay removed when a merge changes them.

[sync]
removed = [".github/dependabot.yml"]
