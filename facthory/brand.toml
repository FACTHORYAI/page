# Facthory Page: upstream WordCraft (storytold/wordcraft) under the Facthory brand.
# Applied to a fresh checkout by facthory/rebrand.py before every build; the tracked tree stays
# upstream's so releases merge cleanly. Order and semantics: the docstring of rebrand.py.

[brand]
name = "Facthory Page"
app_id = "com.facthory.page"
publisher = "Bandpey GmbH"
website = "https://facthory.com/page"
repository = "https://github.com/FACTHORYAI/page"
support = "https://github.com/FACTHORYAI/page/issues"

[upstream]
name = "WordCraft"
team = "ArtCraft team"
repository = "https://github.com/storytold/wordcraft"

[icon]
# Composed by facthory/icons/compose.py from Facthory's mark (icons/brand/, unmodified) and an
# original glyph; render.py renders the platform files from these four.
svg = "page.svg"
base = "facthorypage"
macos_svg = "page-macos.svg"
small_svg = "page-small.svg"
macos_small_svg = "page-macos-small.svg"
author = "Bandpey GmbH"
source = "original artwork drawn in code (`facthory/icons/compose.py`) around Facthory's mark (`facthory/icons/brand/mark.svg`, unmodified)"
licence = "MIT OR Apache-2.0, except Facthory's mark in it: trademark of Bandpey GmbH"
note = """Facthory's marks (`facthory/icons/brand/`) are the brand of Bandpey GmbH, copied unmodified from the Facthory Design System. They are not open source and not covered by this project's MIT OR Apache-2.0 licence: they may be used unmodified only, to name Facthory's own builds, and a logo is never recoloured, stretched, cropped or redrawn. The glyphs and tiles around the mark in the app icons are original work by Bandpey GmbH, under this project's licence."""

# Facthory's other asset files, credited in ATTRIBUTION.md's Facthory block (render.py).
[[asset]]
path = "dmg/background.svg"
author = "@XusBadia (WordCraft contributors); recoloured and retitled by Bandpey GmbH"
source = "derived from WordCraft's `packaging/macos/dmg/background.svg`; title outlined from Inter SemiBold (OFL-1.1)"
licence = "MIT OR Apache-2.0"

[[asset]]
path = "icons/brand/mark.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark, for light grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/mark-mono.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark in white and greys, for dark grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/mark.png"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark, 960 x 1016 pixels), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark beside the name), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark-only.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the lettering alone), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark-only-mono.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the lettering alone, for dark grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/proof/page.png"
author = "Bandpey GmbH"
source = "contact sheet of the icon candidates beside reference shapes, drawn by `facthory/icons/proof.py`; contains Facthory's mark"
licence = "MIT OR Apache-2.0, except Facthory's mark in it: trademark of Bandpey GmbH"

[files]
# Never touched: upstream's licences and notices stay exactly as written (Apache-2.0 §4).
skip = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE", ".github"]
# Credit files: only tokens marked credits = true (ids, paths, URLs) apply, so upstream's authors
# keep their credit while the paths they name follow the renames.
credits = ["ATTRIBUTION.md", "contributors"]
# The ArtCraft marks, licensed only for unmodified WordCraft (docs/brand/LICENSE-brand.txt).
delete = ["docs/brand"]
# Authorship lines the tokens would otherwise turn into a false credit: upstream's data files
# (the spelling supplements, embedded in the app) say who wrote them.
keep = [
  "Written by WordCraft contributors",
  # The environment variable craft-proof (a build input we can't edit) reads for a folder of
  # Hunspell dictionaries; the app's help names the variable that works.
  "WORDCRAFT_DICTIONARIES",
]

# ---------------------------------------------------------------------------------------------
# Rules before the tokens, on upstream's text. Each fails the build when upstream moves it.

[[rule]]
why = "ProgIDs, the AppDir and other dotted names cannot take the space in the display name"
files = ["packaging/*", "apps/*"]
find = 'WordCraft\.(?=[A-Z])'
replace = 'FacthoryPage.'
regex = true

[[rule]]
why = "Settings › Default apps takes the registered name URL-encoded"
files = "apps/wordcraft/src/default_apps.rs"
find = "registeredAppMachine=WordCraft"
replace = "registeredAppMachine=Facthory%20Page"
count = 2

[[rule]]
why = "The ArtCraft Discord becomes our issue tracker: About link"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = 'tl!("Join us on Discord: discord.gg/artcraft")'
replace = 'tl!("Report a problem: github.com/FACTHORYAI/page/issues")'
count = 1

[[rule]]
why = "The title-bar community pill: help, hidden by default"
files = "crates/ui-egui/src/chrome.rs"
find = 'tl!("Join the ArtCraft community on Discord")'
replace = 'tl!("Get help or report a problem")'
count = 1

[[rule]]
files = "crates/ui-egui/src/chrome.rs"
find = 'tl!\("Discord"\),(\s+medium\(11\.5\))'
replace = 'tl!("Help"),\1'
regex = true
count = 1

[[rule]]
files = "crates/ui-egui/src/chrome.rs"
find = '"discord",(\s+t\.on_accent,)'
replace = '"help",\1'
regex = true
count = 1

[[rule]]
files = "crates/ui-egui/src/lib.rs"
find = "show_discord: true,"
replace = "show_discord: false,"
count = 1

[[rule]]
why = "Help tab: the Community Discord button"
files = "crates/ui-egui/src/ribbon/review.rs"
find = '"discord", "Community\nDiscord", "ui.discord"'
replace = '"help", "Help and\nFeedback", "ui.discord"'
count = 1

[[rule]]
why = "File backstage: the Discord community entry"
files = "crates/ui-egui/src/backstage.rs"
find = '("Discord community", "discord")'
replace = '("Help and feedback", "discord")'
count = 1

[[rule]]
files = "crates/ui-egui/src/keytips.rs"
find = 'c("Community Discord", "ui.discord")'
replace = 'c("Help and feedback", "ui.discord")'
count = 1

# The spelling list (sorted; a test checks the order) knows our name in its place, not upstream's.
# Since upstream's CP1.3 it is data of craft-i18n ([i18n].data), not a file of the tree.
[[rule]]
why = "The spelling list drops ArtCraft"
files = "craft-i18n/language-data/en-us/en-extra.txt"
i18n = true
find = '^artcraft\n'
replace = ""
regex = true
count = 1

[[rule]]
why = "The spelling list drops WordCraft"
files = "craft-i18n/language-data/en-us/en-extra.txt"
i18n = true
find = '^wordcraft\n'
replace = ""
regex = true
count = 1

[[rule]]
why = "The spelling list knows Facthory, in its sorted place"
files = "craft-i18n/language-data/en-us/en-extra.txt"
i18n = true
find = '^facebook\n'
replace = "facebook\nfacthory\n"
regex = true
count = 1

[[rule]]
why = "macOS: the CLI goes inside the app, beside the app's own executable, so a Facthory agent finds the MCP server where the app is installed (W5); the Windows and Linux installers already carry it"
files = "packaging/macos/package.sh"
find = '''
cp "$WORK/bin/wordcraft" "$APP/Contents/MacOS/WordCraft"
'''
replace = '''
cp "$WORK/bin/wordcraft" "$APP/Contents/MacOS/WordCraft"
cp "$WORK/bin/wordcraft-cli" "$APP/Contents/MacOS/wordcraft-cli"
'''
count = 1

[[rule]]
why = "... signed with the hardened runtime before the bundle, as nested code is"
files = "packaging/macos/package.sh"
find = '''
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/WordCraft"
'''
replace = '''
sign --options runtime "$APP/Contents/MacOS/wordcraft-cli"
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/WordCraft"
'''
count = 1

[[rule]]
why = "Windows: the installer's suite folder (Programs\\ArtCraft\\<app>, Program Files\\ArtCraft\\<app>) is ours, and the installer's own policy check expects the same name"
files = ["packaging/windows/*.wxs", "packaging/windows/*.wxi", "packaging/windows/*.ps1", "packaging/windows/*.md"]
find = "ArtCraft"
replace = "Facthory"

# Windows signing runs in CI only, through GitHub's OIDC token (the owner's rule, 2026-10-31): the
# release workflow signs in to Azure with azure/login, so no client secret exists anywhere, and
# Artifact Signing's library takes that sign-in from the Azure CLI. facthory-release.yml says so
# with AZURE_SIGNING_OIDC=1; without it, upstream's paths are unchanged.

[[rule]]
why = "Windows signing through OIDC: Artifact Signing needs only its endpoint, account and profile"
files = "packaging/windows/sign.ps1"
find = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
"""
replace = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
if ($env:AZURE_SIGNING_OIDC -eq '1') { $azureVars = 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE' }
"""
count = 1

[[rule]]
why = "... and the signing library tries the Azure CLI's sign-in alone, not the runner's other identities"
files = "packaging/windows/sign.ps1"
find = """
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
replace = """
    } | ForEach-Object {
      if ($env:AZURE_SIGNING_OIDC -eq '1') {
        $_.ExcludeCredentials = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
      }
      $_
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
count = 1

# A test of the community button expects it on by default and under upstream's label; the
# branded build has it off by default and calls it Help and feedback.
[[rule]]
why = "The community-button test turns it on itself, under our label"
files = "crates/ui-egui/src/tests.rs"
find = '''    let mut a = app();
    a.run("ui.backstage", json!({"value": true})).unwrap();
    let mut h = harness(a);
    h.run_steps(2);
    assert!(h.query_by_label("Discord community").is_some(), "the community link shows by default");
'''
replace = '''    let mut a = app();
    a.ui.show_discord = true;
    a.run("ui.backstage", json!({"value": true})).unwrap();
    let mut h = harness(a);
    h.run_steps(2);
    assert!(h.query_by_label("Help and feedback").is_some(), "the community link shows when the button is on");
'''
count = 1

[[rule]]
why = "... and the off state looks for our label"
files = "crates/ui-egui/src/tests.rs"
find = 'assert!(h.query_by_label("Discord community").is_none(), "the backstage link honors the same setting");'
replace = 'assert!(h.query_by_label("Help and feedback").is_none(), "the backstage link honors the same setting");'
count = 1

# A PDF test pins the hash of an export, whose Creator and Producer name the app.
[[rule]]
why = "The golden hash of the PDF with a grey box: the file names Facthory Page as its producer"
files = "crates/pdf/src/tests.rs"
find = "assert_eq!(h, 0x1edbbffab353d744, \"{h:#x}\");"
replace = "assert_eq!(h, 0x5f9304fd08007fa9, \"{h:#x}\");"
count = 1

# Test data that holds the name: the brand's name is two words, which changes a word count.
[[rule]]
why = "A word-count test counts the name as one word; ours is two"
files = "crates/doc/src/tests.rs"
find = 'count_words("WordCraft是一个文字处理器，很好用！")'
replace = 'count_words("Brand是一个文字处理器，很好用！")'
count = 1

# The Flatpak recipes grant access to the shared updater's host folder, which our builds leave out
# with craft-update (above): without it they need neither the permission nor the folder.
[[rule]]
why = "The Flatpak recipes drop the shared updater's host permissions"
files = ["packaging/linux/flatpak/ai.storyteller.wordcraft.yml", "packaging/linux/flatpak/ai.storyteller.wordcraft.bundle.yml"]
find = '''  # The shared updater inspects and updates this installation via flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/ArtCraft/versions:ro
'''
replace = ""
count = 2

[[rule]]
why = "The Flatpak image push names a fallback user: ours"
files = "packaging/linux/flatpak-oci.sh"
find = "${GITHUB_ACTOR:-storytold}"
replace = "${GITHUB_ACTOR:-facthory}"
count = 1

# Notarization with the App Store Connect API key of Bandpey GmbH's other releases, not an Apple
# account's app-specific password: package.sh reads the key's file, id and issuer (the release
# workflow writes the .p8 under $RUNNER_TEMP, mode 600, and removes it again).
[[rule]]
why = "Notarization takes an API key: the script's header"
files = "packaging/macos/package.sh"
find = '''# Notarization (env; all three needed, and a real identity):
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
'''
replace = '''# Notarization (env; all three needed, and a real identity), with an App Store Connect API key:
#   NOTARY_KEY_FILE (the .p8), NOTARY_KEY_ID, NOTARY_ISSUER
'''
count = 1

[[rule]]
why = "... the condition"
files = "packaging/macos/package.sh"
find = '''elif [[ -n "${APPLE_ID:-}" ]] && [[ -n "${APPLE_PASSWORD:-}" ]] && [[ -n "${APPLE_TEAM_ID:-}" ]]; then
  NOTARIZE=1
else
  warn "macOS: APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID incomplete; signed but not notarized"
fi
'''
replace = '''elif [[ -f "${NOTARY_KEY_FILE:-}" ]] && [[ -n "${NOTARY_KEY_ID:-}" ]] && [[ -n "${NOTARY_ISSUER:-}" ]]; then
  NOTARIZE=1
else
  warn "macOS: NOTARY_KEY_FILE / NOTARY_KEY_ID / NOTARY_ISSUER incomplete; signed but not notarized"
fi
'''
count = 1

[[rule]]
why = "... the submission"
files = "packaging/macos/package.sh"
find = '''  out="$(xcrun notarytool submit "$file" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
    --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json)" || true
'''
replace = '''  out="$(xcrun notarytool submit "$file" --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" \
    --issuer "$NOTARY_ISSUER" --wait --timeout 1h --output-format json)" || true
'''
count = 1

[[rule]]
why = "... and the log of a refusal"
files = "packaging/macos/package.sh"
find = '''      xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
'''
replace = '''      xcrun notarytool log "$id" --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
'''
count = 1

# Upstream's own updater (craft-update, from craft-libs) checks and installs the upstream apps'
# releases, by their repositories and ai.storyteller.* ids, and carries their names into the binary.
# It is left out: facthory/update/ is the updater that runs, and facthory/update/updates_ui.rs
# stands in for upstream's update window ([[copy]] below).

[[rule]]
why = "No self-update helper of upstream's flow at start"
files = "apps/wordcraft/src/main.rs"
find = "    // Windows: the update helper is a copy of this program started with `--finish-update`.\n    #[cfg(windows)]\n    if let Some(result) = craft_update::self_update::finish(&wordcraft_ui_egui::UPDATE_APP, &std::env::args_os().skip(1).collect::<Vec<_>>()) {\n        std::process::exit(i32::from(result.is_err()));\n    }\n"
replace = ""
count = 1

[[rule]]
why = "... nor upstream's description of its app for craft-update"
files = "crates/ui-egui/src/lib.rs"
find = '''(?s)/// WordCraft as craft-update knows it.*?\n};\n\n'''
replace = ""
regex = true
count = 1

[[rule]]
why = "A process that carries another program's AppImage variables must not install an update (upstream #5653): ours turns off too"
files = "apps/wordcraft/src/main.rs"
find = "                app.disable_self_update();\n"
replace = "                app.disable_self_update();\n                facthory_update::disable();\n"
count = 1

[[rule]]
why = "... and no craft-update dependency"
files = ["apps/wordcraft/Cargo.toml", "crates/ui-egui/Cargo.toml"]
find = "craft-update = { workspace = true }\n"
replace = ""
count = 2

[[rule]]
why = "... in the workspace either"
files = "Cargo.toml"
find = '^craft-update = \{ git = "https://github.com/storytold/craft-libs".*\n'
replace = ""
regex = true
count = 1

# The interface catalogs (craft-i18n, [i18n] below): the same changes as the code's rules above,
# so each new English string keeps a row, and the shared catalog's ArtCraft rows, which Facthory
# Page never shows, name us.

[[rule]]
why = "Catalogs: the About link"
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = "Join us on Discord: discord.gg/artcraft"
new_key = "Report a problem: github.com/FACTHORYAI/page/issues"

[[rule]]
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = "Join the ArtCraft community on Discord"
new_key = "Get help or report a problem"

[[rule]]
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = 'Community\nDiscord'
new_key = 'Help and\nFeedback'

[[rule]]
files = "craft-i18n/locales/*/wordcraft.tsv"
kind = "tsv"
i18n = true
key = "Discord community"
new_key = "Help and feedback"

[[rule]]
why = "The shared catalog's rows that name upstream"
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "ArtCraft website"
new_key = "Facthory website"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "ArtCraft Website"
new_key = "Facthory Website"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "ArtCraft"
new_key = "Facthory"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "Join the ArtCraft Discord"
new_key = "Get help or report a problem"

[[rule]]
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "Join the ArtCraft Discord…"
new_key = "Get Help or Report a Problem…"

[[rule]]
why = "... and a translation of this row that names upstream (English until translated)"
files = "craft-i18n/locales/*/common.tsv"
kind = "tsv"
i18n = true
key = "Join us on Discord"
new_key = "Join us on Discord"

