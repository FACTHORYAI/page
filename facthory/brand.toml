# ---------------------------------------------------------------------------------------------
# Windows Installer: our own UpgradeCode and component GUIDs, stable across releases.

[guids]
namespace = "https://facthory.com/page/windows-installer"
# The installer's own policy check records the upgrade identity: the same GUIDs, mapped alike.
files = ["packaging/windows/*.wxs", "packaging/windows/install-policy.json"]

# ---------------------------------------------------------------------------------------------
# Rules after the tokens and renames: the credits, which name upstream on purpose.

[[rule]]
phase = "after"
why = "About: who makes it and what it is based on (brand licence: plain-text credit allowed)"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = 'A free, open-source word processor written from scratch in Rust.\nPart of the Crafting Apps from the ArtCraft team.'
replace = 'A free, open-source word processor from Facthory.\nBased on WordCraft by the ArtCraft team.'
count = 1

[[rule]]
phase = "after"
why = "About: our copyright, then upstream's, which the licence requires us to keep"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = "MIT OR Apache-2.0. Copyright (c) 2026 ArtCraft Team and the Facthory Page contributors."
replace = "MIT OR Apache-2.0. Copyright (c) 2026 Bandpey GmbH. Based on WordCraft, copyright (c) 2026 ArtCraft Team and the WordCraft contributors."
count = 1

[[rule]]
phase = "after"
why = "Windows file properties: our copyright and upstream's"
files = "apps/facthorypage/build.rs"
find = '"Copyright (c) the Facthory Page authors. MIT OR Apache-2.0."'
replace = '"Copyright (c) Bandpey GmbH; based on WordCraft, copyright (c) the WordCraft authors. MIT OR Apache-2.0."'
count = 1

[[rule]]
phase = "after"
why = "The app icon is ours; its attribution rows say so"
files = "ATTRIBUTION.md"
find = '^(\| `assets/app-icon/(?!facthory[a-z]+-logo-)[^`]+` \|).*$'
replace = '\1 Bandpey GmbH | original artwork drawn in code (`facthory/icons/compose.py`) around the Facthory mark (`facthory/icons/brand/mark.svg`, unmodified), rendered by `facthory/icons/render.py` | MIT OR Apache-2.0, except the Facthory mark in it: trademark of Bandpey GmbH | Facthory Page app icon |'
regex = true

# Facthory's mark in the About box (facthory/ui/facthory_logo.rs, copied below), which upstream's
# shows as text only: its module, and one call before the app's name.
[[rule]]
phase = "after"
why = "The About box's logo: its module"
files = "crates/ui-egui/src/lib.rs"
find = "pub mod updates_ui;\n"
replace = "pub mod updates_ui;\nmod facthory_logo;\n"
count = 1

[[rule]]
phase = "after"
why = "The About box's logo: drawn above the name, the mark of the window's theme"
files = "crates/ui-egui/src/dialogs/dispatch.rs"
find = "        _ => {\n            ui.label(egui::RichText::new(tl!(\"Facthory Page\")).font(semibold(22.0)));\n"
replace = "        _ => {\n            crate::facthory_logo::show(ui);\n            ui.label(egui::RichText::new(tl!(\"Facthory Page\")).font(semibold(22.0)));\n"
count = 1

# The updater (facthory/update/facthory_update.rs, copied below): its module and its calls from
# main.rs. It needs no dependency the app lacks.
[[rule]]
phase = "after"
why = "The updater's module"
files = "apps/facthorypage/src/main.rs"
find = "mod default_apps;\n"
replace = "mod default_apps;\nmod facthory_update;\n"
count = 1

[[rule]]
phase = "after"
why = "The updater starts with the window, in runs that keep preferences"
files = "apps/facthorypage/src/main.rs"
find = "            app.watch_desktop_theme(&cc.egui_ctx);\n"
replace = "            app.watch_desktop_theme(&cc.egui_ctx);\n            facthory_update::start(\"Facthory Page\", facthorypage_control_key::settings_dir().filter(|_| prefs_enabled()));\n"
count = 1

[[rule]]
phase = "after"
why = "The updater's notice"
files = "apps/facthorypage/src/main.rs"
find = "        self.0.ui(ui);\n"
replace = "        self.0.ui(ui);\n        facthory_update::ui(ui.ctx());\n"
count = 1

[[rule]]
phase = "after"
why = "A downloaded update installs as the app quits"
files = "apps/facthorypage/src/main.rs"
find = "        save_prefs(&self.0);\n"
replace = "        save_prefs(&self.0);\n        facthory_update::on_exit();\n"
count = 1

[[rule]]
phase = "after"
why = "... and as macOS quits it, which skips on_exit"
files = "apps/facthorypage/src/main.rs"
find = "    save_prefs(app);\n"
replace = "    save_prefs(app);\n    facthory_update::on_exit();\n"
count = 1

# ---------------------------------------------------------------------------------------------

[[rule]]
phase = "after"
why = "Catalogs: the About credit, as in the code"
files = "craft-i18n/locales/*/facthorypage.tsv"
kind = "tsv"
i18n = true
key = 'A free, open-source word processor written from scratch in Rust.\nPart of the Crafting Apps from the ArtCraft team.'
new_key = 'A free, open-source word processor from Facthory.\nBased on WordCraft by the ArtCraft team.'

[[rule]]
phase = "after"
files = "craft-i18n/locales/*/facthorypage.tsv"
kind = "tsv"
i18n = true
key = "MIT OR Apache-2.0. Copyright (c) 2026 ArtCraft Team and the Facthory Page contributors."
new_key = "MIT OR Apache-2.0. Copyright (c) 2026 Bandpey GmbH. Based on WordCraft, copyright (c) 2026 ArtCraft Team and the WordCraft contributors."

[[copy]]
# Upstream's update window, without its updater (facthory/update/updates_ui.rs).
from = "update/updates_ui.rs"
to = "crates/ui-egui/src/updates_ui.rs"

[[copy]]
from = "ui/facthory_logo.rs"
to = "crates/ui-egui/src/facthory_logo.rs"

[[copy]]
from = "update/facthory_update.rs"
to = "apps/facthorypage/src/facthory_update.rs"

[[copy]]
from = "icons/app-icon"
to = "assets/app-icon"
replace = true

[[rule]]
phase = "after"
why = "DMG window: 256 colours, not 16, so the chrome app icon's gradients do not band (the TIFF grows by a few KB)"
files = "packaging/macos/dmg/generate.py"
find = "PALETTE = 16  # colours in background.tiff"
replace = "PALETTE = 256  # colours in background.tiff"
count = 1

[[copy]]
# The DMG window: our colours, title and icon (the release workflow renders it with generate.py).
from = "dmg/background.svg"
to = "packaging/macos/dmg/background.svg"

[[copy]]
# Packages carry README.md (packaging/env.sh copy_docs): ours, not upstream's.
from = "../.github/README.md"
to = "README.md"

[i18n]
# The interface catalogs: storytold/craft-i18n at craft-i18n.rev, which the build checks out here
# (CRAFT_I18N_DIR); the tables Facthory Page embeds are branded with the tree.
dir = "craft-i18n"
tables = ["common.tsv", "wordcraft.tsv"]
# Other craft-i18n files the build embeds and the brand edits, from the checkout's root.
data = ["language-data/en-us/en-extra.txt"]

# ---------------------------------------------------------------------------------------------
# `rebrand.py check`: no upstream mark in what ships, except the credits above.

[check]
paths = ["packaging", "assets", "apps/*/build.rs", "apps/*/index.html", "Cargo.toml"]
# Developer notes and scripts under packaging/ do not ship.
exclude = ["*/tests/*", "*.png", "*.ico", "*.icns", "*.md", "*.py"]
# These also keep upstream's updater out: its feeds are its repositories (storytold/<app>) and
# its ids ai.storyteller.<app>, and it names the ArtCraft Launcher, so a build that links it
# again fails here (it did: craft-update, upstream releases of 2026-10).
forbid = [
  "artcraft", "wordcraft", "storytold", "storyteller", "getartcraft", "learning machines",
  "crafting apps", "photocraft", "vectorcraft", "filmcraft", "lightcraft", "pdfcraft",
  "effectcraft", "designcraft", "gridcraft", "deckcraft",
]
allow = [
  'Based on WordCraft by the ArtCraft team.',
  'Based on WordCraft, copyright (c) 2026 ArtCraft Team and the WordCraft contributors.',
  'based on WordCraft, copyright (c) the WordCraft authors.',
  'Written by WordCraft contributors',
  # Provenance of the public-domain hyphenation patterns embedded in the app.
  '% DesignCraft US English hyphenation patterns (Liang/TeX notation).',
  "trained with DesignCraft's patgen-style trainer",
  'Released into the public domain (CC0-1.0) by the DesignCraft contributors.',
  # Build input used unmodified (Cargo git dependency), not a product surface.
  'https://github.com/storytold/craft-libs',
  "craft-proof is storytold/craft-libs main",
  # craft-proof (craft-libs, a build input we can't edit) names the folder it reads dictionaries from
  # and credits the English word supplement's authors in the language data window.
  'WORDCRAFT_DICTIONARIES',
  'wordcraftdictionaries',
  'is written by WordCraft contributors and licensed MIT OR Apache-2.0.',
  # An English word in the Hunspell dictionaries embedded from craft-i18n, not a mark.
  'storyteller/MS',
  # Upstream's forks of egui and winit (Cargo git dependencies), and the translations the
  # Flatpak recipe checks out: build inputs used unmodified.
  'https://github.com/storytold/egui.git',
  'https://github.com/storytold/winit.git',
  'https://github.com/storytold/craft-i18n',
  # The installer's policy check, shared by upstream's apps, names its siblings' ids (build time).
  "$policy.id -in 'deckcraft','filmcraft','soundcraft'",
]

# ---------------------------------------------------------------------------------------------
# facthory/sync.py: upstream files the patch set removed stay removed when a merge changes them.

[sync]
removed = [".github/dependabot.yml"]
